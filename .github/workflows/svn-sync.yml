name: SVN Sync
on:
  schedule:
    - cron: '0 2 * * *'  # daily at 2am UTC
  workflow_dispatch:      # allows manual trigger

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install subversion
        run: sudo apt-get install -y subversion

      - name: Configure git
        run: |
          git config user.email "gdisirio@gmail.com"
          git config user.name "Giovanni Di Sirio"

      - name: Sync from SVN
        run: |
          git rm -r --cached .
          svn export https://svn.code.sf.net/p/chibios/code/trunk . --force
          git add -A
          git commit -m "SVN sync $(date +%Y-%m-%d)" || echo "Nothing to commit"
          git push origin master
