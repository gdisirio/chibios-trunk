name: SVN Sync

on:
  schedule:
    - cron: '0 */4 * * *'
  workflow_dispatch:

concurrency:
  group: svn-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y subversion rsync

      - name: Configure git
        run: |
          git config user.name "Giovanni Di Sirio"
          git config user.email "gdisirio@gmail.com"

      - name: Sync from SVN and push
        shell: bash
        run: |
          set -euo pipefail

          SVN_URL="https://svn.code.sf.net/p/chibios/code/trunk"
          EXPORT_DIR="/tmp/svn-export"
          REV_FILE=".svn-sync-rev"
          COMMIT_MSG_FILE="/tmp/svn-commit-message.txt"
          LOG_FILE="/tmp/svn-log.txt"
          LATEST_LOG_FILE="/tmp/svn-latest-log.txt"

          CURR_REV="$(svn info --show-item revision "$SVN_URL")"
          echo "Current SVN revision: $CURR_REV"

          if [[ -f "$REV_FILE" ]]; then
            LAST_REV="$(tr -d '[:space:]' < "$REV_FILE")"
            if ! [[ "$LAST_REV" =~ ^[0-9]+$ ]]; then
              echo "Invalid $REV_FILE content: $LAST_REV"
              exit 1
            fi
          else
            LAST_REV="$CURR_REV"
          fi

          echo "Last synced revision: $LAST_REV"

          rm -rf "$EXPORT_DIR"
          svn export "$SVN_URL" "$EXPORT_DIR" --force

          rsync -a --delete \
            --exclude='.git' \
            --exclude='.github' \
            "$EXPORT_DIR"/ ./

          echo "$CURR_REV" > "$REV_FILE"
          git add -A

          if git diff --cached --quiet; then
            echo "No changes to commit."
            exit 0
          fi

          NEXT_REV="$((LAST_REV + 1))"

          if [[ "$LAST_REV" -lt "$CURR_REV" ]]; then
            svn log -r "${NEXT_REV}:${CURR_REV}" "$SVN_URL" --incremental > "$LOG_FILE"
            svn log -r "${CURR_REV}:${CURR_REV}" "$SVN_URL" --incremental > "$LATEST_LOG_FILE"

            SUBJECT="$(awk '
              BEGIN { in_msg=0 }
              /^-+$/ { next }
              /^r[0-9]+ \| / { in_msg=1; next }
              in_msg && /^[[:space:]]*$/ { next }
              in_msg {
                sub(/^[[:space:]]+/, "", $0)
                print $0
                exit
              }
            ' "$LATEST_LOG_FILE")"

            if [[ -z "$SUBJECT" ]]; then
              SUBJECT="(no message)"
            fi

            echo "r${CURR_REV} ${SUBJECT}" > "$COMMIT_MSG_FILE"
            echo >> "$COMMIT_MSG_FILE"
            echo "SVN sync details:" >> "$COMMIT_MSG_FILE"

            if [[ "$NEXT_REV" -eq "$CURR_REV" ]]; then
              echo "- revision: r${CURR_REV}" >> "$COMMIT_MSG_FILE"
            else
              echo "- revisions: r${NEXT_REV}-r${CURR_REV}" >> "$COMMIT_MSG_FILE"
            fi

            REMAINDER="$(awk '
              BEGIN { in_msg=0; first=1 }
              /^-+$/ { next }
              /^r[0-9]+ \| / { in_msg=1; next }
              in_msg && /^[[:space:]]*$/ { next }
              in_msg {
                sub(/^[[:space:]]+/, "", $0)
                if (first) {
                  first=0
                  next
                }
                print
              }
            ' "$LATEST_LOG_FILE")"

            if [[ -n "$REMAINDER" ]]; then
              echo >> "$COMMIT_MSG_FILE"
              echo "Latest SVN commit details:" >> "$COMMIT_MSG_FILE"
              echo "$REMAINDER" >> "$COMMIT_MSG_FILE"
            fi

            if [[ "$NEXT_REV" -lt "$CURR_REV" ]]; then
              echo >> "$COMMIT_MSG_FILE"
              echo "Included SVN revisions:" >> "$COMMIT_MSG_FILE"
              awk '
                BEGIN {
                  rev = ""
                  in_msg = 0
                  first = 1
                }
                /^-+$/ {
                  rev = ""
                  in_msg = 0
                  first = 1
                  next
                }
                /^r[0-9]+ \| / {
                  rev = $1
                  in_msg = 1
                  first = 1
                  next
                }
                in_msg && /^[[:space:]]*$/ {
                  next
                }
                in_msg {
                  sub(/^[[:space:]]+/, "", $0)
                  if (first) {
                    print "- " rev " " $0
                    first = 0
                  }
                }
              ' "$LOG_FILE" >> "$COMMIT_MSG_FILE"
            fi
          else
            echo "SVN sync r${CURR_REV}" > "$COMMIT_MSG_FILE"
          fi

          echo "Commit message:"
          cat "$COMMIT_MSG_FILE"

          git commit -F "$COMMIT_MSG_FILE"
          git push origin HEAD:master
