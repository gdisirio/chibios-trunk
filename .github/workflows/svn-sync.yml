      - name: Sync from SVN
        run: |
          set -euo pipefail

          URL="https://svn.code.sf.net/p/chibios/code/trunk"

          # Get current revision
          CURR_REV=$(svn info --show-item revision "$URL")

          # Read last revision (default to current if missing)
          if [ -f .svn-sync-rev ]; then
            LAST_REV=$(cat .svn-sync-rev)
          else
            LAST_REV=$CURR_REV
          fi

          echo "Last: $LAST_REV  Current: $CURR_REV"

          # Export latest tree
          rm -rf /tmp/svn-export
          svn export "$URL" /tmp/svn-export --force

          rsync -a --delete --delete-excluded \
            --exclude='.git' \
            --exclude='.github' \
            /tmp/svn-export/ ./

          git add -A

          if git diff --cached --quiet; then
            echo "No changes"
            exit 0
          fi

          # Build commit message from SVN log
          if [ "$LAST_REV" -lt "$CURR_REV" ]; then
            LOG=$(svn log -r $((LAST_REV+1)):$CURR_REV "$URL" --incremental --quiet \
              | awk '
                /^r[0-9]+/ {rev=$1; next}
                NF {print rev " " $0}
              ')
          else
            LOG="No intermediate revisions"
          fi

          {
            echo "SVN sync r${LAST_REV}-r${CURR_REV}"
            echo
            echo "$LOG"
          } > commit_msg.txt

          git commit -F commit_msg.txt
          git push origin master

          # Update revision marker
          echo "$CURR_REV" > .svn-sync-rev
          git add .svn-sync-rev
          git commit -m "Update SVN sync marker r$CURR_REV" || true
          git push origin master
